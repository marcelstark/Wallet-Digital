<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Últimos movimientos | Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles-wallet.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <a href="menu.html" class="btn btn-outline-secondary btn-sm mb-4">← Volver al menú</a>
    <section class="card wallet-card fade-in">
      <div class="card-body p-4 p-md-5">
        <h1 class="h2 page-title">Últimos movimientos</h1>
        <p class="text-secondary">Revisa el detalle de las operaciones realizadas.</p>
        <div id="alert-container" aria-live="polite"></div>

        <form class="row g-3 align-items-end mt-1" id="filterForm">
          <div class="col-md-6">
            <label for="transactionFilter" class="form-label">Filtrar por tipo</label>
            <select id="transactionFilter" class="form-select">
              <option value="all">Todos los movimientos</option>
              <option value="deposit">Depósitos</option>
              <option value="withdraw">Retiros</option>
              <option value="transfer_sent">Transferencias enviadas</option>
              <option value="transfer_received">Transferencias recibidas</option>
              <option value="purchase">Compras</option>
            </select>
          </div>
          <div class="col-md-6">
            <p class="mb-2 text-md-end">Saldo actual: <strong id="currentBalance" class="text-success">$0</strong></p>
          </div>
        </form>

        <ul id="transactionsList" class="list-group list-group-flush mt-4" aria-live="polite"></ul>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/wallet.js"></script>
  <script>
    $(function () {
      requireLogin();
      $('#currentBalance').text(formatCurrency(getBalance()));

      function showTransactions(filter) {
        const transactions = getTransactions().filter(function (transaction) {
          return filter === 'all' || transaction.type === filter;
        });
        const $list = $('#transactionsList');
        $list.empty();

        if (!transactions.length) {
          $list.append('<li class="list-group-item text-secondary py-4 text-center">No hay movimientos para el filtro seleccionado.</li>');
          return;
        }

        transactions.forEach(function (transaction) {
          const income = transaction.amount >= 0;
          const sign = income ? '+' : '-';
          const amountClass = income ? 'income' : 'expense';
          const item = `
            <li class="list-group-item transaction-item">
              <div class="d-flex align-items-center justify-content-between gap-3">
                <div class="d-flex align-items-center">
                  <span class="transaction-icon">${getTransactionIcon(transaction.type)}</span>
                  <div>
                    <strong>${getTransactionLabel(transaction.type)}</strong>
                    <p class="mb-0 small text-secondary">${transaction.description}</p>
                    <small class="text-secondary">${transaction.date}</small>
                  </div>
                </div>
                <strong class="transaction-amount ${amountClass}">${sign}${formatCurrency(Math.abs(transaction.amount))}</strong>
              </div>
            </li>
          `;
          $list.append(item);
        });
      }

      showTransactions('all');

      $('#transactionFilter').change(function () {
        showTransactions($(this).val());
      });
    });
  </script>
</body>
</html>
