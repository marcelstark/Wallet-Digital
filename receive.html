<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recibir dinero | Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles-wallet.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <a href="menu.html" class="btn btn-outline-secondary btn-sm mb-4">← Volver al menú</a>
    <section class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card wallet-card fade-in">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 page-title">Recibir dinero</h1>
            <p class="text-secondary">Simula una transferencia recibida en tu cuenta.</p>
            <div id="alert-container" aria-live="polite"></div>
            <div class="alert alert-primary mt-3">Saldo actual: <strong id="currentBalance">$0</strong></div>

            <form id="receiveForm" novalidate>
              <div class="mb-3">
                <label for="sender" class="form-label">Nombre o alias de quien envía</label>
                <input type="text" id="sender" class="form-control" placeholder="Ejemplo: ana.rodriguez" required>
              </div>
              <div class="mb-3">
                <label for="amount" class="form-label">Monto recibido</label>
                <input type="number" id="amount" class="form-control" min="1" step="1" placeholder="Ejemplo: 12000" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Confirmar recepción</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/wallet.js"></script>
  <script>
    $(function () {
      requireLogin();
      $('#currentBalance').text(formatCurrency(getBalance()));

      $('#receiveForm').submit(function (event) {
        event.preventDefault();
        const sender = $('#sender').val().trim();
        const amount = Number($('#amount').val());

        if (!sender) {
          showAlert('Ingresa el nombre o alias de quien realizó el envío.', 'danger');
          return;
        }

        if (!Number.isFinite(amount) || amount <= 0) {
          showAlert('Ingresa un monto válido mayor que cero.', 'danger');
          return;
        }

        const newBalance = getBalance() + amount;
        setBalance(newBalance);
        addTransaction('transfer_received', 'Transferencia recibida de ' + sender, amount);
        $('#currentBalance').text(formatCurrency(newBalance));
        showAlert('Recibiste ' + formatCurrency(amount) + ' de ' + sender + '. Redirigiendo al menú...', 'success');

        setTimeout(function () {
          window.location.href = 'menu.html';
        }, 2000);
      });
    });
  </script>
</body>
</html>
