<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Depositar | Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles-wallet.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <a href="menu.html" class="btn btn-outline-secondary btn-sm mb-4">← Volver al menú</a>
    <section class="row justify-content-center">
      <div class="col-lg-7">
        <div class="card wallet-card fade-in">
          <div class="card-body p-4 p-md-5">
            <h1 class="h2 page-title">Depositar dinero</h1>
            <p class="text-secondary">Ingresa el monto que deseas sumar a tu billetera.</p>
            <div id="alert-container" aria-live="polite"></div>

            <div class="alert alert-primary mt-3">Saldo actual: <strong id="currentBalance">$0</strong></div>

            <form id="depositForm" novalidate>
              <div class="mb-3">
                <label for="amount" class="form-label">Monto a depositar</label>
                <input type="number" id="amount" class="form-control" min="1" step="1" placeholder="Ejemplo: 10000" required>
              </div>
              <button type="submit" class="btn btn-success w-100">Realizar depósito</button>
            </form>
            <p id="depositMessage" class="text-success fw-semibold text-center mt-3 mb-0"></p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/wallet.js"></script>
  <script>
    $(function () {
      requireLogin();
      $('#currentBalance').text(formatCurrency(getBalance()));

      $('#depositForm').submit(function (event) {
        event.preventDefault();
        const amount = Number($('#amount').val());

        if (!Number.isFinite(amount) || amount <= 0) {
          showAlert('Ingresa un monto válido mayor que cero.', 'danger');
          return;
        }

        const newBalance = getBalance() + amount;
        setBalance(newBalance);
        addTransaction('deposit', 'Depósito de fondos', amount);

        $('#currentBalance').text(formatCurrency(newBalance));
        $('#depositMessage').text('Monto depositado: ' + formatCurrency(amount));
        showAlert('Depósito realizado correctamente. Redirigiendo al menú principal...', 'success');

        setTimeout(function () {
          window.location.href = 'menu.html';
        }, 2000);
      });
    });
  </script>
</body>
</html>
