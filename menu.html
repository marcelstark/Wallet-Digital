<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menú principal | Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles-wallet.css">
</head>
<body>
  <header>
    <nav class="navbar navbar-expand-lg navbar-dark wallet-navbar shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="menu.html">Alke Wallet</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#walletMenu" aria-controls="walletMenu" aria-expanded="false" aria-label="Abrir menú">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="walletMenu">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link" href="deposit.html">Depositar</a></li>
            <li class="nav-item"><a class="nav-link" href="withdraw.html">Retirar</a></li>
            <li class="nav-item"><a class="nav-link" href="sendmoney.html">Enviar</a></li>
            <li class="nav-item"><a class="nav-link" href="receive.html">Recibir</a></li>
            <li class="nav-item"><a class="nav-link" href="transactions.html">Movimientos</a></li>
          </ul>
          <button id="logoutButton" class="btn btn-outline-light btn-sm ms-lg-3">Cerrar sesión</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="container py-4 py-md-5">
    <div id="alert-container" aria-live="polite"></div>
    <section class="mb-4 fade-in" aria-labelledby="menu-title">
      <h1 id="menu-title" class="page-title h2">Menú principal</h1>
      <p class="text-secondary">Selecciona una operación para continuar.</p>
    </section>

    <section class="card wallet-card balance-card mb-4 fade-in" aria-label="Saldo disponible">
      <div class="card-body p-4 p-md-5">
        <p class="mb-2 text-white-50">Saldo disponible</p>
        <p id="balance" class="balance-value mb-0">$0</p>
      </div>
    </section>

    <section class="row g-3" aria-label="Acciones disponibles">
      <div class="col-6 col-lg-4">
        <button class="btn btn-success action-btn w-100" data-page="deposit.html" data-name="depósitos"><span class="icon">↓</span>Depositar</button>
      </div>
      <div class="col-6 col-lg-4">
        <button class="btn btn-danger action-btn w-100" data-page="withdraw.html" data-name="retiros"><span class="icon">↑</span>Retirar</button>
      </div>
      <div class="col-6 col-lg-4">
        <button class="btn btn-warning action-btn w-100" data-page="sendmoney.html" data-name="envío de dinero"><span class="icon">↗</span>Enviar dinero</button>
      </div>
      <div class="col-6 col-lg-4">
        <button class="btn btn-primary action-btn w-100" data-page="receive.html" data-name="recepción de dinero"><span class="icon">↙</span>Recibir dinero</button>
      </div>
      <div class="col-12 col-lg-4">
        <button class="btn btn-info text-white action-btn w-100" data-page="transactions.html" data-name="últimos movimientos"><span class="icon">☷</span>Últimos movimientos</button>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/wallet.js"></script>
  <script>
    $(function () {
      requireLogin();
      $('#balance').text(formatCurrency(getBalance()));

      $('.action-btn').click(function () {
        const page = $(this).data('page');
        const name = $(this).data('name');
        redirectWithMessage('Redirigiendo a ' + name + '...', page);
      });

      $('#logoutButton').click(function () {
        localStorage.removeItem(STORAGE.loggedIn);
        redirectWithMessage('Sesión cerrada. Redirigiendo al inicio...', 'login.html');
      });
    });
  </script>
</body>
</html>
