<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión | Alke Wallet</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../CSS/styles-wallet.css">
</head>
<body>
  <main class="container d-flex align-items-center justify-content-center min-vh-100 py-4">
    <section class="card wallet-card login-panel w-100 fade-in" aria-labelledby="login-title">
      <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
          <p class="wallet-brand h2 mb-2">Alke Wallet</p>
          <h1 id="login-title" class="h3 page-title">Inicio de sesión</h1>
          <p class="text-secondary mb-0">Administra tus fondos de forma simple.</p>
        </div>

        <div id="alert-container" aria-live="polite"></div>

        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" class="form-control" placeholder="usuario@wallet.com" required>
          </div>
          <div class="mb-4">
            <label for="password" class="form-label">Contraseña</label>
            <input type="password" id="password" class="form-control" placeholder="123456" required>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2">Iniciar sesión</button>
        </form>

        <div class="alert alert-light border mt-4 mb-0 small" role="note">
          <strong>Acceso de prueba:</strong><br>
          usuario@wallet.com<br>
          Contraseña: 123456
        </div>
      </div>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../JS/wallet.js"></script>
  <script>
    $(function () {
      $('#loginForm').submit(function (event) {
        event.preventDefault();

        const email = $('#email').val().trim();
        const password = $('#password').val().trim();

        if (!email || !password) {
          showAlert('Completa el email y la contraseña.', 'danger');
          return;
        }

        if (email === 'usuario@wallet.com' && password === '123456') {
          localStorage.setItem(STORAGE.loggedIn, 'true');
          showAlert('Inicio de sesión exitoso. Redirigiendo al menú principal...', 'success');
          setTimeout(function () {
            window.location.href = 'menu.html';
          }, 1200);
        } else {
          showAlert('Credenciales incorrectas. Intenta nuevamente.', 'danger');
        }
      });
    });
  </script>
</body>
</html>
